  logging: {}
capability_notes:
- The server advertises prompts and resources capabilities, but prompts/list and resources/list both returned
  JSON-RPC error -32001 "UCP discovery failed" (data.code invalid_profile_url) because every call requires
  meta["ucp-agent"].profile. Only tools/list answered anonymously.
