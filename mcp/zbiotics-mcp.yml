generated: '2026-09-05'
method: probed
source: https://zbiotics.com/api/ucp/mcp
name: ZBiotics Universal Commerce (UCP) MCP Server
summary: ZBiotics exposes a live Model Context Protocol server on its own domain at /api/ucp/mcp. It implements
  the Universal Commerce Protocol (UCP) dev.ucp.shopping service and answers tools/list and initialize
  without credentials, returning 13 tools with full JSON Schema 2020-12 inputSchemas covering catalog
  search/lookup, cart, checkout and order retrieval for the ZBiotics store. Discovery is open; invocation
  is not - tools/call requires a dereferenceable ucp-agent profile URI, and get_order additionally requires
  a customer-account JWT.
status: live
ownership_note: The endpoint is served by Shopify (the store's commerce platform) but it is published
  on the company's own registrable domain, is scoped to the ZBiotics store (shop_id 11751391332), and
  the UCP manifest at /.well-known/ucp.json names merchant "ZBiotics" with merchant_origin zbiotics.com.
  It transacts ZBiotics' own catalog and nobody else's, so it is recorded as ZBiotics' agent surface,
  in the same way a provider's API hosted on AWS is the provider's API.
deployment:
  mode: remote
  endpoint: https://zbiotics.com/api/ucp/mcp
  auth: unknown
  auth_detail: Tiered, and none of the tiers is a conventional API key. tools/list and initialize are
    anonymous. tools/call requires meta["ucp-agent"].profile to resolve to a document the store can fetch.
    get_order requires a customer-account JWT (HTTP 403 -32000 AuthenticationRequired observed anonymously).
    Recorded as unknown rather than none or oauth because no single value describes it; see authentication/zbiotics-authentication.yml.
  verified: probed
protocol:
  transport: streamable-http
  jsonrpc: '2.0'
  mcp_protocol_version: '2025-06-18'
  server_info:
    name: universal-commerce
    version: 0.1.0
  ucp_api_version: '2026-08-25'
  response_header: x-shopify-ucp-mcp-api-version
server_capabilities:
