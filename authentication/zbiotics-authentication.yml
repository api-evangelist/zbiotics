docs: https://zbiotics.com/agents.md
summary: >-
  ZBiotics runs a three-tier posture, established by probing rather than by reading a docs page.
  DISCOVERY on the UCP MCP endpoint is anonymous - tools/list and initialize answered a POST with
  no credential. INVOCATION is not: tools/call requires meta["ucp-agent"]["profile"] to be a URI
  the store can actually fetch, and it performs a live outbound GET of that document on every
  call. ORDER-SCOPED tools require a customer-account JWT on top of that. The customer account
  surface is OpenID Connect: zbiotics.com and account.zbiotics.com both serve an OIDC discovery
  document with authorization_code + PKCE S256 and a jwks_uri. There is no API-key programme, no
  developer registration, and no published client-credentials flow.
derived_from: probed discovery documents; the provider publishes no OpenAPI securitySchemes.
schemes:
- id: ucp-mcp-discovery-anonymous
  type: none
  surface: https://zbiotics.com/api/ucp/mcp
  scope: tools/list, initialize
  description: >-
    No Authorization header is required or accepted for tool discovery. A bare POST returned the
    full 13-tool manifest with input schemas.
  verified: probed
  evidence:
    url: https://zbiotics.com/api/ucp/mcp
    method: POST
    http_status: 200
    note: tools/list returned 13 tools with no credential supplied.
- id: ucp-agent-profile
  type: agent-profile-uri
  surface: https://zbiotics.com/api/ucp/mcp
  scope: tools/call (all 13 tools)
  description: >-
    Not a bearer credential and not an API key - a dereferenceable identity. Every tool's
    inputSchema requires meta["ucp-agent"]["profile"], and the store performs a live outbound GET
    of that URI on each call. Omitting it returns -32001 invalid_profile_url (HTTP 422); supplying
    a URI the store cannot fetch returns -32001 profile_unreachable (HTTP 422). An agent must
    therefore publish a reachable profile document before it can transact.
  verified: probed
  evidence:
    url: https://zbiotics.com/api/ucp/mcp
    method: POST
    http_status: 422
    note: >-
      Observed twice - once with meta omitted (invalid_profile_url) and once with a profile URI
      that does not resolve (profile_unreachable).
- id: customer-account-jwt
  type: http
  scheme: bearer
  bearer_format: JWT
  surface: https://zbiotics.com/api/ucp/mcp
  scope: get_order (and, by the platform's documentation, other customer-scoped tools)
  description: >-
