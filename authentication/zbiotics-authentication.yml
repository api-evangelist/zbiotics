gaps:
- No security.txt on any host (404 on zbiotics.com, account.zbiotics.com, zbiotics.myshopify.com, privacy.zbiotics.com).
- No published developer credential lifecycle - no key issuance, rotation, or revocation documentation.
- >-
  Outside of the order tools there is no per-agent credential, so for catalog, cart and checkout
  the only identity signal available to the store is the ucp-agent profile URI it dereferences -
  strong enough to require an agent to be publicly identifiable, but not a secret and not revocable
  per key.
