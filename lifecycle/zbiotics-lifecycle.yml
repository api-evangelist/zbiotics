summary: >-
  ZBiotics publishes no API versioning policy, no deprecation policy, no SLA and no status page of
  its own. What it does publish is a dated protocol version, and it keeps two superseded versions
  addressable - which is a de facto version policy inherited from the Universal Commerce Protocol
  rather than authored by the company.
