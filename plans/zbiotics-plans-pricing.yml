  metering and no paywall on the UCP MCP endpoint - tool discovery is free and anonymous, and the
  transaction an agent performs is a retail purchase at the same price a human pays. plan_count is
  therefore 0, and that is the correct answer rather than a gap. What the store does publish, and
  publishes machine-readably, is its retail price list, recorded below so the commercial surface
  an agent actually transacts is not invisible.
