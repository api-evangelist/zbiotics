apis:
- name: ZBiotics Universal Commerce MCP API
  description: >-
    The anonymous Model Context Protocol endpoint ZBiotics serves on its own domain, implementing
    the Universal Commerce Protocol dev.ucp.shopping service at version 2026-08-25. tools/list
    answers without credentials and returns 13 tools with full JSON Schema 2020-12 input schemas -
    search_catalog, lookup_catalog, get_product, create/get/update/cancel_cart, create/get/update/
    complete/cancel_checkout and get_order - operating on the ZBiotics retail catalog. Every call
    requires meta["ucp-agent"].profile, and the provider states that completing a checkout
    requires contemporaneous buyer approval of payment.
  humanURL: https://zbiotics.com/agents.md
  baseURL: https://zbiotics.com/api/ucp/mcp
