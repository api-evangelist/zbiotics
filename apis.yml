aid: zbiotics
name: ZBiotics
description: >-
  ZBiotics is a San Francisco biotechnology company that makes the world's first genetically
  engineered probiotics, sold direct to consumers - Pre-Alcohol, a drink containing the patented
  B. subtilis ZB183 strain engineered to break down acetaldehyde after drinking, and Sugar-to-Fiber,
  which converts dietary sugar into fiber in the gut. It publishes no developer program, no
  OpenAPI and no SDKs, but its storefront is a fully instrumented agentic-commerce surface: an
  anonymous Model Context Protocol server at zbiotics.com/api/ucp/mcp implementing the Universal
  Commerce Protocol dev.ucp.shopping service with 13 catalog, cart, checkout and order tools; a
  /.well-known/ucp.json merchant manifest; OIDC and RFC 9728 discovery documents for customer
  accounts; and a first-party /llms.txt and /agents.md that tell agents how to transact.
